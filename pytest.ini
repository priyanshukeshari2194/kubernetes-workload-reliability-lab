[pytest]
# Make 'app/' importable without installing the package.
pythonpath = app

# Discover tests in the tests/ tree.
testpaths = tests

# Verbose output by default for educational clarity.
addopts = -v --tb=short

# asyncio mode for any future async tests.
asyncio_mode = auto

# Suppress the pytest-asyncio loop scope deprecation warning.
# Function scope means each async test gets its own event loop.
asyncio_default_fixture_loop_scope = function
