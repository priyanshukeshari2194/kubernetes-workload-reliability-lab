# Secret — placeholder for sensitive values
# ==========================================
# This file contains ONLY placeholder values.  It exists to demonstrate the
# correct structure and to show that secrets belong in a separate object from
# ConfigMaps.
#
# NEVER commit real credentials to this file.  The .gitignore excludes
# files matching *.secret.yaml, but this baseline file (secret.yaml) is
# committed intentionally because it contains no real data.
#
# For a real deployment you would:
# 1. Populate values using an external secret manager (e.g., External Secrets
#    Operator, Sealed Secrets, Vault Agent Injector).
# 2. Or create the secret manually and exclude it from Git:
#    kubectl create secret generic reliability-app-secret \
#      --from-literal=API_KEY=<real-value> \
#      --namespace reliability-lab
#
# Why Kubernetes Secrets are NOT truly secret by default:
# - Values are base64-encoded, not encrypted.  Base64 is an encoding, not
#   encryption; anyone with kubectl get secret can decode them instantly.
# - etcd does not encrypt secrets at rest unless encryption-at-rest is
#   explicitly configured for the cluster.
# - RBAC must be used to limit who can read Secret objects.
#
# Base64 encoding of the placeholder string "REPLACE_ME":
# echo -n "REPLACE_ME" | base64  →  UkVQTEFDRV9NRQ==

apiVersion: v1
kind: Secret
metadata:
  name: reliability-app-secret
  namespace: reliability-lab
  labels:
    app.kubernetes.io/name: reliability-app
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kubectl
type: Opaque
data:
  # Replace this with a real base64-encoded value before deploying to any
  # environment that connects to a real external service.
  API_KEY: UkVQTEFDRV9NRQ==   # base64("REPLACE_ME") — not a real credential
