# ServiceAccount — least-privilege identity for the application Pod
# =================================================================
# By default, every Pod in Kubernetes uses the "default" ServiceAccount of
# its namespace, which may have cluster-wide permissions depending on your
# cluster configuration.
#
# Creating a dedicated ServiceAccount allows us to:
# 1. Grant only the permissions the application actually needs (none, in this
#    case — the app never calls the Kubernetes API).
# 2. Disable auto-mounting of the API server token, preventing an attacker
#    who compromises the container from using it to query or mutate cluster
#    state.
# 3. Audit API calls made by this identity independently.
#
# automountServiceAccountToken: false
#   The app does not call the Kubernetes API, so we do not mount the token.
#   If your application needs to call the API (e.g., a controller or operator)
#   you would set this to true and add a Role + RoleBinding granting only the
#   specific verbs and resources needed.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: reliability-app-sa
  namespace: reliability-lab
  labels:
    app.kubernetes.io/name: reliability-app
    app.kubernetes.io/component: serviceaccount
automountServiceAccountToken: false
